spring.application.name=Yagimail

# IMAP Settings
mail.imap.host=${MAIL_IMAP_HOST}
mail.imap.port=993
mail.imap.username=${MAIL_IMAP_USERNAME}
mail.imap.password=${MAIL_IMAP_PASSWORD}
mail.imap.protocol=imaps
mail.imap.trash=${MAIL_IMAP_TRASH:Trash}
mail.imap.sent=${MAIL_IMAP_SENT:Sent}

# SMTP Settings (未指定時は IMAP と同じ資格情報で Gmail SMTP を利用)
mail.smtp.host=${MAIL_SMTP_HOST:smtp.gmail.com}
mail.smtp.port=${MAIL_SMTP_PORT:587}
mail.smtp.username=${MAIL_SMTP_USERNAME:${MAIL_IMAP_USERNAME}}
mail.smtp.password=${MAIL_SMTP_PASSWORD:${MAIL_IMAP_PASSWORD}}

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID}

# Internal JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
